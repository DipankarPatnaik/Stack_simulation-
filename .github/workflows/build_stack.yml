name: Build Stack Simulator EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build stack_sim.exe
        run: cl /EHsc /Fe:stack_sim.exe stack.c

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: stack_sim
          path: stack_sim.exe
